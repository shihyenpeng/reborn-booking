<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reborn 芮朋麻醉會社｜線上預約</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    html,body{margin:0;min-height:100%;background:#fbfaf7;color:#181818;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;box-sizing:border-box;text-align:center}
    h1{font-family:Georgia,"Times New Roman",serif;font-size:48px;letter-spacing:.04em;margin:0 0 12px}
    .zh{font-size:20px;letter-spacing:.18em;color:#777;margin-bottom:46px}
    .status{font-size:17px;color:#777;line-height:1.8}
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <h1>Reborn</h1>
      <div class="zh">芮朋麻醉會社</div>
      <div class="status" id="status">正在連線至預約系統…</div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  const LIFF_ID = '2011678150-UOU0NroQ';
  const APP_URL =
    'https://script.google.com/macros/s/AKfycbysPMNi32tEjmnm5bSHRHkTkRnXf31z8pXvQ5nZkpnx2yJ9uV_v9ucp2l_y8fX50Uwqxw/exec';

  const statusEl = document.getElementById('status');

  function goToBooking(idToken) {
    if (!idToken) {
      window.location.replace(APP_URL);
      return;
    }

    /*
      v5：用 form POST 把 raw LINE ID Token 直接交給 Apps Script。
      Token 不放在 query string / fragment，也不依賴 window.name。
    */
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = APP_URL;
    form.style.display = 'none';

    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'id_token';
    input.value = String(idToken);

    form.appendChild(input);
    document.body.appendChild(form);
    form.submit();
  }

  async function start() {
    if (typeof liff === 'undefined') {
      statusEl.textContent = 'LINE 元件載入失敗，正在改用一般預約模式…';
      goToBooking('');
      return;
    }

    try {
      await liff.init({ liffId: LIFF_ID });

      if (liff.isLoggedIn()) {
        const idToken = liff.getIDToken() || '';
        statusEl.textContent = 'LINE 身分確認完成，正在開啟預約系統…';
        goToBooking(idToken);
        return;
      }

      // 在 LINE LIFF 環境中若尚未登入，交由 LINE Login。
      if (liff.isInClient()) {
        statusEl.textContent = '正在進行 LINE 登入…';
        liff.login();
        return;
      }

      // 一般瀏覽器仍可使用預約系統，P 欄保持空白。
      statusEl.textContent = '正在開啟預約系統…';
      goToBooking('');

    } catch (error) {
      console.error('LIFF 初始化失敗：', error);
      statusEl.textContent = '正在改用一般預約模式…';
      goToBooking('');
    }
  }

  start();
})();
</script>
</body>
</html>
