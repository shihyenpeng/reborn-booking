<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reborn 後台</title>
  <meta name="theme-color" content="#f5f3ed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Reborn 後台">
  <link rel="apple-touch-icon" sizes="180x180" href="https://shihyenpeng.github.io/reborn-booking/Reborn_RB_AppIcon_180x180.png">
  <link rel="icon" type="image/png" href="https://shihyenpeng.github.io/reborn-booking/Reborn_RB_AppIcon_180x180.png">
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{
      min-height:100vh;min-height:100dvh;
      display:flex;align-items:center;justify-content:center;
      padding:28px;background:#f5f3ed;color:#20211f;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
    }
    .card{
      width:min(100%,390px);text-align:center;padding:46px 28px 34px;
      background:rgba(255,255,255,.62);border:1px solid rgba(32,33,31,.08);
      border-radius:28px;box-shadow:0 18px 50px rgba(32,33,31,.07)
    }
    .logo{width:112px;height:112px;object-fit:cover;border-radius:25px;display:block;margin:0 auto 22px}
    .brand{font-family:Georgia,"Times New Roman",serif;font-size:28px;letter-spacing:.04em;margin:0}
    .sub{margin:8px 0 30px;font-size:14px;color:#77746d;letter-spacing:.08em}
    .enter{
      display:block;width:100%;padding:15px 18px;border-radius:14px;
      background:#20211f;color:#fff;text-decoration:none;font-size:16px;
      font-weight:650;letter-spacing:.04em
    }
    .hint{margin:18px 0 0;font-size:12px;line-height:1.6;color:#99958c}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="https://shihyenpeng.github.io/reborn-booking/Reborn_RB_AppIcon_180x180.png" alt="Reborn RB Logo">
    <h1 class="brand">Reborn</h1>
    <div class="sub">芮朋麻醉會社｜管理後台</div>
    <a class="enter" href="https://script.google.com/macros/s/AKfycbysPMNi32tEjmnm5bSHRHkTkRnXf31z8pXvQ5nZkpnx2yJ9uV_v9ucp2l_y8fX50Uwqxw/exec?page=admin">進入 Reborn 後台</a>
    <p class="hint">建議將此頁加入 iPhone 主畫面，<br>即可使用 Reborn 專屬圖示快速開啟。</p>
  </main>
</body>
</html>
